[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quake-lens"
version = "0.0.1"
description = "Fetch public earthquake catalogs and compute honest forecasting statistics (b-value, Omori-Utsu decay)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
quake-lens = "quake_lens.__main__:main"

[tool.setuptools.packages.find]
include = ["quake_lens*"]

[tool.ruff.lint]
# select だとデフォルトルール (E4/E7/E9/F) を置き換えて pyflakes まで無効になるため extend-select
extend-select = ["D"]
ignore = [
    "D100",  # モジュールdocstringは強制しない (小さなユーティリティ/エントリポイントに冗長なため)
    "D101",  # 公開クラスのdocstringは強制しない (自明な dataclass 等が多いため)
    "D102",  # 公開メソッドのdocstringは強制しない (自明な override/property に冗長なため)
    "D103",  # 公開関数のdocstringは強制しない (短いヘルパー関数まで縛らない)
    "D104",  # パッケージ(__init__.py)のdocstringは強制しない (中身が re-export のみのことが多いため)
    "D105",  # マジックメソッドのdocstringは強制しない (__repr__ 等は自明)
    "D106",  # ネストされた公開クラスのdocstringは強制しない (テスト用の内部クラス等)
    "D107",  # __init__ のdocstringは強制しない (クラス側docstringで説明する方針)
    "D400",  # 1行目末尾のピリオドは強制しない (日本語docstringは「。」で終わり英語ピリオド不要)
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"conftest.py" = ["D"]
