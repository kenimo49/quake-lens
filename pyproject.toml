[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quake-lens"
version = "0.0.1"
description = "Fetch public earthquake catalogs and compute honest forecasting statistics (b-value, Omori-Utsu decay)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
quake-lens = "quake_lens.__main__:main"

[tool.setuptools.packages.find]
include = ["quake_lens*"]
