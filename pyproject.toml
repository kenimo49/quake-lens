[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quake-lens"
version = "0.0.1"
description = "Fetch public earthquake catalogs and compute honest forecasting statistics (b-value, Omori-Utsu decay)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp"]

[project.scripts]
quake-lens = "quake_lens.__main__:main"
quake-lens-mcp = "quake_lens.mcp_server:main"

[tool.setuptools.packages.find]
include = ["quake_lens*"]

[tool.ruff.lint]
# select だとデフォルトルール (E4/E7/E9/F) を置き換えて pyflakes まで無効になるため extend-select
extend-select = ["D"]
# ignoreは実測で違反が出るルールだけ最小限に残す (2026-07-29 全Dルールを個別に有効化して確認)。
# D100-D107はこのコードベースでは違反0件のため課さない=そのまま有効。
ignore = [
    "D400",  # 1行目末尾のピリオドは強制しない (docstringは日本語で「。」終わりのため。CLAUDE.md参照)
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"conftest.py" = ["D"]
