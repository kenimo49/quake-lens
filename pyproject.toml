[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quake-lens"
version = "0.0.1"
description = "Fetch public earthquake catalogs and compute honest forecasting statistics (b-value, Omori-Utsu decay)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
quake-lens = "quake_lens.__main__:main"

[tool.setuptools.packages.find]
include = ["quake_lens*"]

[tool.ruff.lint]
# select だとデフォルトルール (E4/E7/E9/F) を置き換えて pyflakes まで無効になるため extend-select
extend-select = ["D"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D400",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"conftest.py" = ["D"]
